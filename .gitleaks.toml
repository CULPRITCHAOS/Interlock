# Gitleaks Configuration
# ======================
# MINIMAL allowlist for known test credentials in test files.
# Keep this TIGHT - only allowlist specific patterns, not broad wildcards.

title = "Interlock Gitleaks Config"

[allowlist]
description = "Minimal allowlist for known test credentials only"

# ONLY the exact test patterns we know about - nothing broad
regexes = [
    # Exact test API key used in validation-tests.ts
    '''test_api_key_1234567890abcdefghij''',
    # Exact test signing key used in anti-gaming-test.ts
    '''test-signing-key-12345''',
]

# Scope to specific test files only (defense in depth)
paths = [
    '''scripts/validation-tests\.ts$''',
    '''scripts/anti-gaming-test\.ts$''',
    '''ci_sim/scripts/validation-tests\.ts$''',
]


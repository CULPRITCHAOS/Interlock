name: Adapter Stress Tests

# Run stress tests against each adapter to validate survival and protection
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      adapter:
        description: 'Adapter to test (all, pinecone, weaviate, milvus, elasticsearch, langchain, llamaindex)'
        required: false
        default: 'all'
      stress_cycles:
        description: 'Number of stress cycles per adapter'
        required: false
        default: '25'
      use_mocks:
        description: 'Use mock clients (true/false)'
        required: false
        default: 'true'

concurrency:
  group: adapter-stress-test
  cancel-in-progress: false

jobs:
  adapter-stress-test:
    name: Adapter Stress Test - ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    strategy:
      fail-fast: false
      matrix:
        adapter: [pinecone, weaviate, milvus, elasticsearch, langchain, llamaindex]

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check if adapter should run
        id: check
        run: |
          SELECTED="${{ github.event.inputs.adapter || 'all' }}"
          if [ "$SELECTED" == "all" ] || [ "$SELECTED" == "${{ matrix.adapter }}" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Run adapter stress test (Protected)
        if: steps.check.outputs.should_run == 'true'
        id: protected
        run: |
          echo "Running PROTECTED stress test for ${{ matrix.adapter }}"
          npx tsx scripts/adapter-stress-test.ts \
            --adapter ${{ matrix.adapter }} \
            --mode protected \
            --cycles ${{ github.event.inputs.stress_cycles || '25' }} \
            --use-mocks ${{ github.event.inputs.use_mocks || 'true' }} \
            --output results/adapter-stress/${{ matrix.adapter }}/protected.json
        continue-on-error: true

      - name: Run adapter stress test (Control)
        if: steps.check.outputs.should_run == 'true'
        id: control
        run: |
          echo "Running CONTROL stress test for ${{ matrix.adapter }}"
          npx tsx scripts/adapter-stress-test.ts \
            --adapter ${{ matrix.adapter }} \
            --mode control \
            --cycles ${{ github.event.inputs.stress_cycles || '25' }} \
            --use-mocks ${{ github.event.inputs.use_mocks || 'true' }} \
            --output results/adapter-stress/${{ matrix.adapter }}/control.json
        continue-on-error: true

      - name: Generate comparison report
        if: steps.check.outputs.should_run == 'true'
        run: |
          mkdir -p results/adapter-stress/${{ matrix.adapter }}
          
          cat > results/adapter-stress/${{ matrix.adapter }}/comparison_${{ github.run_number }}.md << 'EOF'
          # Adapter Stress Test: ${{ matrix.adapter }}
          
          **Run:** #${{ github.run_number }}
          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit:** ${{ github.sha }}
          
          ## Results Summary
          
          | Mode | Status | Cycles | Survival |
          |------|--------|--------|----------|
          | Protected | ${{ steps.protected.outcome }} | ${{ github.event.inputs.stress_cycles || '25' }} | See artifacts |
          | Control | ${{ steps.control.outcome }} | ${{ github.event.inputs.stress_cycles || '25' }} | See artifacts |
          
          ## Validation Checks
          
          - [ ] Latency cliff detection triggered
          - [ ] Confidence degradation tracked
          - [ ] Quality floor refusal tested
          - [ ] Shadow mode logged correctly
          
          ## Artifacts
          
          - `protected.json` - Protected run metrics
          - `control.json` - Control run metrics
          
          ---
          *Generated by Interlock Adapter Stress Test Workflow*
          EOF

      - name: Create JSON summary
        if: steps.check.outputs.should_run == 'true'
        run: |
          cat > results/adapter-stress/${{ matrix.adapter }}/summary_${{ github.run_number }}.json << EOF
          {
            "adapter": "${{ matrix.adapter }}",
            "run_number": ${{ github.run_number }},
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commit": "${{ github.sha }}",
            "config_fingerprint": "$(echo '${{ toJson(github.event.inputs) }}' | sha256sum | cut -d' ' -f1)",
            "protected_result": "${{ steps.protected.outcome }}",
            "control_result": "${{ steps.control.outcome }}",
            "cycles": ${{ github.event.inputs.stress_cycles || 25 }},
            "use_mocks": ${{ github.event.inputs.use_mocks || true }},
            "pass": ${{ steps.protected.outcome == 'success' && steps.control.outcome != 'success' }}
          }
          EOF

      - name: Upload adapter stress artifacts
        if: steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: adapter-stress-${{ matrix.adapter }}-${{ github.run_number }}
          path: results/adapter-stress/${{ matrix.adapter }}/**
          retention-days: 60

  # Generate combined summary
  stress-test-summary:
    name: Stress Test Summary
    runs-on: ubuntu-latest
    needs: [adapter-stress-test]
    if: always()

    permissions:
      contents: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: results/adapter-stress
        continue-on-error: true

      - name: Generate final summary
        run: |
          echo "# 🔥 Adapter Stress Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Adapter Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Adapter | Protected | Control | Pass |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|---------|------|" >> $GITHUB_STEP_SUMMARY
          
          for adapter in pinecone weaviate milvus elasticsearch langchain llamaindex; do
            JSON_FILE="results/adapter-stress/adapter-stress-${adapter}-${{ github.run_number }}/${adapter}/summary_${{ github.run_number }}.json"
            if [ -f "$JSON_FILE" ]; then
              PROTECTED=$(jq -r '.protected_result' "$JSON_FILE" 2>/dev/null || echo "N/A")
              CONTROL=$(jq -r '.control_result' "$JSON_FILE" 2>/dev/null || echo "N/A")
              PASS=$(jq -r '.pass' "$JSON_FILE" 2>/dev/null || echo "false")
              PASS_ICON=$([[ "$PASS" == "true" ]] && echo "✅" || echo "❌")
              echo "| $adapter | $PROTECTED | $CONTROL | $PASS_ICON |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $adapter | - | - | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Success Criteria" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Protected runs should **survive** (circuit breaker prevents crash)" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Control runs should **crash** (demonstrates real failure)" >> $GITHUB_STEP_SUMMARY
          echo "- Pass = Protected survives AND Control crashes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Workflow: adapter-stress-test.yml*" >> $GITHUB_STEP_SUMMARY

      - name: Upload combined summary
        uses: actions/upload-artifact@v4
        with:
          name: adapter-stress-summary-${{ github.run_number }}
          path: results/adapter-stress/**
          retention-days: 60

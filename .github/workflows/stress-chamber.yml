name: Stress Chamber Tests

# Run stress tests daily to validate Interlock protection under extreme load
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stability_cycles:
        description: 'Number of stability test cycles'
        required: false
        default: '50'
      stress_profile:
        description: 'Stress profile (light, medium, heavy)'
        required: false
        default: 'medium'

# Only run one stress test at a time
concurrency:
  group: stress-chamber
  cancel-in-progress: false

jobs:
  # Run comparative stress tests (protected vs control)
  stress-chamber:
    name: Stress Chamber Comparison
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine stress profile
        id: profile
        run: |
          if [ "${{ github.event.inputs.stress_profile }}" != "" ]; then
            echo "profile=${{ github.event.inputs.stress_profile }}" >> $GITHUB_OUTPUT
          else
            echo "profile=medium" >> $GITHUB_OUTPUT
          fi

      - name: Run stress chamber (both protected and control)
        run: |
          echo "Running stress chamber with profile: ${{ steps.profile.outputs.profile }}"
          npx tsx scripts/stress-chamber.ts \
            --seed 42 \
            --initial-size 10000 \
            --profile ${{ steps.profile.outputs.profile }} \
            --both \
            --no-visualize

      - name: Collect stress chamber results
        if: always()
        run: |
          echo "# 🔥 Stress Chamber Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** ${{ steps.profile.outputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d results/stress_chamber ]; then
            LATEST_RESULT=$(ls -t results/stress_chamber/*.md 2>/dev/null | head -1)
            if [ -f "$LATEST_RESULT" ]; then
              echo "## Latest Stress Test" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              cat "$LATEST_RESULT" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Stress test completed at $(date -u +"%Y-%m-%d %H:%M:%S UTC")*" >> $GITHUB_STEP_SUMMARY

      - name: Upload stress test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-chamber-results-${{ steps.profile.outputs.profile }}-${{ github.run_number }}
          path: |
            results/stress_chamber/**/*.md
            results/stress_chamber/**/*.json
          retention-days: 60

  # Run long-run stability test (50 cycles by default)
  stability-test:
    name: Long-Run Stability Test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run stability test
        run: |
          echo "Running long-run stability test..."
          npx tsx scripts/long-run-stability.ts \
            --cycles ${{ github.event.inputs.stability_cycles || '50' }} \
            --seed 42

      - name: Analyze memory and performance
        if: always()
        run: |
          echo "# 📊 Stability Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d results/stability ]; then
            LATEST_RESULT=$(ls -t results/stability/*.md 2>/dev/null | head -1)
            if [ -f "$LATEST_RESULT" ]; then
              echo "## Stability Report" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              cat "$LATEST_RESULT" >> $GITHUB_STEP_SUMMARY
            fi

            # Check for memory metrics
            LATEST_JSON=$(ls -t results/stability/*.json 2>/dev/null | head -1)
            if [ -f "$LATEST_JSON" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "## Key Metrics" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              node -e "
                const fs = require('fs');
                try {
                  const data = JSON.parse(fs.readFileSync('$LATEST_JSON', 'utf8'));

                  console.log('| Metric | Value |');
                  console.log('|--------|-------|');

                  if (data.memory_leak_detected !== undefined) {
                    const status = data.memory_leak_detected ? '❌ DETECTED' : '✅ NONE';
                    console.log('| Memory Leak | ' + status + ' |');
                  }

                  if (data.total_cycles) {
                    console.log('| Cycles Completed | ' + data.total_cycles + ' |');
                  }

                  if (data.avg_latency_ms) {
                    console.log('| Avg Latency | ' + data.avg_latency_ms.toFixed(2) + ' ms |');
                  }

                  if (data.recall_degradation_pct) {
                    console.log('| Recall Degradation | ' + data.recall_degradation_pct.toFixed(2) + '% |');
                  }
                } catch (e) {
                  console.log('Could not parse metrics');
                }
              " >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Stability test completed at $(date -u +"%Y-%m-%d %H:%M:%S UTC")*" >> $GITHUB_STEP_SUMMARY

      - name: Upload stability test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-test-results-${{ github.run_number }}
          path: |
            results/stability/**/*.md
            results/stability/**/*.json
          retention-days: 60

  # Generate incident reports and forensic data
  generate-incident-reports:
    name: Generate Incident Reports
    runs-on: ubuntu-latest
    needs: [stress-chamber, stability-test]
    if: always()
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download stress chamber results
        uses: actions/download-artifact@v4
        with:
          name: stress-chamber-results-${{ github.run_number }}
          path: results/stress_chamber
        continue-on-error: true

      - name: Download stability results
        uses: actions/download-artifact@v4
        with:
          name: stability-test-results-${{ github.run_number }}
          path: results/stability
        continue-on-error: true

      - name: Generate summary report
        run: |
          mkdir -p results/incidents

          cat > results/incidents/stress_test_summary_${{ github.run_number }}.md << EOF
          # Stress Test Summary - Run ${{ github.run_number }}

          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Workflow:** ${{ github.workflow }}
          **Triggered by:** ${{ github.event_name }}

          ## Test Configuration
          - Stability Cycles: ${{ github.event.inputs.stability_cycles || '50' }}
          - Stress Growth Steps: ${{ github.event.inputs.stress_growth_steps || '25' }}

          ## Results Summary
          - Stress Chamber: See artifacts
          - Stability Test: See artifacts

          ## Artifacts
          - [Stress Chamber Results](../stress_chamber/)
          - [Stability Test Results](../stability/)

          ---
          *Generated by Interlock CI/CD Pipeline*
          EOF

      - name: Upload incident reports
        uses: actions/upload-artifact@v4
        with:
          name: incident-reports-${{ github.run_number }}
          path: results/incidents/*.md
          retention-days: 90

  # Final status summary
  stress-test-summary:
    name: Stress Test Summary
    runs-on: ubuntu-latest
    needs: [stress-chamber, stability-test, generate-incident-reports]
    if: always()

    permissions: {}

    steps:
      - name: Generate final summary
        run: |
          echo "# 🎯 Stress Test Workflow Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Stress Chamber | ${{ needs.stress-chamber.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stability Test | ${{ needs.stability-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Incident Reports | ${{ needs.generate-incident-reports.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.stress-chamber.result }}" == "success" ] && [ "${{ needs.stability-test.result }}" == "success" ]; then
            echo "✅ **All stress tests completed successfully**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some stress tests did not complete as expected**" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Workflow run: #${{ github.run_number }}*" >> $GITHUB_STEP_SUMMARY

name: Adapter Stability Tests

# Long-run stability validation for each adapter (≥50 cycles)
on:
  schedule:
    # Run weekly on Saturday at 4 AM UTC
    - cron: '0 4 * * 6'
  workflow_dispatch:
    inputs:
      adapter:
        description: 'Adapter to test (all, pinecone, weaviate, milvus, elasticsearch, langchain, llamaindex)'
        required: false
        default: 'all'
      cycles:
        description: 'Number of stability cycles (minimum 50 for certification)'
        required: false
        default: '50'

concurrency:
  group: adapter-stability
  cancel-in-progress: false

jobs:
  adapter-stability:
    name: Stability Test - ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    strategy:
      fail-fast: false
      matrix:
        adapter: [pinecone, weaviate, milvus, elasticsearch, langchain, llamaindex]

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check if adapter should run
        id: check
        run: |
          SELECTED="${{ github.event.inputs.adapter || 'all' }}"
          if [ "$SELECTED" == "all" ] || [ "$SELECTED" == "${{ matrix.adapter }}" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Run adapter stability test
        if: steps.check.outputs.should_run == 'true'
        id: stability
        run: |
          echo "Running ${{ github.event.inputs.cycles || '50' }} cycle stability test for ${{ matrix.adapter }}"
          mkdir -p results/adapter-stability/${{ matrix.adapter }}
          
          npx tsx scripts/adapter-stability-test.ts \
            --adapter ${{ matrix.adapter }} \
            --cycles ${{ github.event.inputs.cycles || '50' }} \
            --output results/adapter-stability/${{ matrix.adapter }}/stability_${{ github.run_number }}.json
        continue-on-error: true

      - name: Generate stability report
        if: steps.check.outputs.should_run == 'true'
        run: |
          mkdir -p results/adapter-stability/${{ matrix.adapter }}
          
          # Create Markdown report
          cat > results/adapter-stability/${{ matrix.adapter }}/report_${{ github.run_number }}.md << 'REPORT_EOF'
          # Adapter Stability Report: ${{ matrix.adapter }}
          
          **Run:** #${{ github.run_number }}
          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit:** ${{ github.sha }}
          **Cycles:** ${{ github.event.inputs.cycles || '50' }}
          
          ## Stability Metrics
          
          | Metric | Value | Status |
          |--------|-------|--------|
          | Total Cycles | ${{ github.event.inputs.cycles || '50' }} | - |
          | Test Result | ${{ steps.stability.outcome }} | ${{ steps.stability.outcome == 'success' && '✅' || '❌' }} |
          
          ## Tracked Metrics
          
          - **Confidence Drift**: Percentage change in confidence score across cycles
          - **Memory Growth**: MB per cycle (should be bounded)
          - **False Positives**: Count of incorrect degradation triggers
          - **State Transitions**: Count of circuit state changes
          
          ## Trend Analysis
          
          *See JSON artifact for detailed per-cycle data*
          
          ## Stability Criteria
          
          For **Class V** certification:
          - Confidence drift < 5% over 50 cycles
          - Memory growth < 0.1 MB/cycle (bounded)
          - False negative rate = 0
          - State file size bounded (< 10 KB)
          
          ---
          *Generated by Interlock Adapter Stability Workflow*
          REPORT_EOF

      - name: Create JSON summary with trends
        if: steps.check.outputs.should_run == 'true'
        run: |
          cat > results/adapter-stability/${{ matrix.adapter }}/summary_${{ github.run_number }}.json << EOF
          {
            "adapter": "${{ matrix.adapter }}",
            "run_number": ${{ github.run_number }},
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commit": "${{ github.sha }}",
            "config_fingerprint": "$(echo '${{ toJson(github.event.inputs) }}' | sha256sum | cut -d' ' -f1)",
            "cycles_completed": ${{ github.event.inputs.cycles || 50 }},
            "test_result": "${{ steps.stability.outcome }}",
            "metrics": {
              "confidence_drift_percent": null,
              "memory_growth_mb_per_cycle": null,
              "false_positives": null,
              "false_negatives": null,
              "state_transitions": null,
              "final_confidence": null
            },
            "stability_rating": "${{ steps.stability.outcome == 'success' && 'STABLE' || 'UNSTABLE' }}",
            "class_v_eligible": false
          }
          EOF

      - name: Upload stability artifacts
        if: steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: adapter-stability-${{ matrix.adapter }}-${{ github.run_number }}
          path: results/adapter-stability/${{ matrix.adapter }}/**
          retention-days: 90

  # Generate trend table and combined summary
  stability-summary:
    name: Stability Summary
    runs-on: ubuntu-latest
    needs: [adapter-stability]
    if: always()

    permissions:
      contents: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: results/adapter-stability
        continue-on-error: true

      - name: Generate trend table
        run: |
          echo "# 📊 Adapter Stability Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Cycles per adapter:** ${{ github.event.inputs.cycles || '50' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Stability Trend Table" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Adapter | Result | Confidence Drift | Memory Growth | FP | FN | Stable |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|-----------------|---------------|----|----|--------|" >> $GITHUB_STEP_SUMMARY
          
          for adapter in pinecone weaviate milvus elasticsearch langchain llamaindex; do
            JSON_FILE="results/adapter-stability/adapter-stability-${adapter}-${{ github.run_number }}/${adapter}/summary_${{ github.run_number }}.json"
            if [ -f "$JSON_FILE" ]; then
              RESULT=$(jq -r '.test_result' "$JSON_FILE" 2>/dev/null || echo "N/A")
              DRIFT=$(jq -r '.metrics.confidence_drift_percent // "N/A"' "$JSON_FILE" 2>/dev/null)
              MEMORY=$(jq -r '.metrics.memory_growth_mb_per_cycle // "N/A"' "$JSON_FILE" 2>/dev/null)
              FP=$(jq -r '.metrics.false_positives // "N/A"' "$JSON_FILE" 2>/dev/null)
              FN=$(jq -r '.metrics.false_negatives // "N/A"' "$JSON_FILE" 2>/dev/null)
              RATING=$(jq -r '.stability_rating' "$JSON_FILE" 2>/dev/null || echo "N/A")
              STABLE_ICON=$([[ "$RATING" == "STABLE" ]] && echo "✅" || echo "❌")
              echo "| $adapter | $RESULT | $DRIFT | $MEMORY | $FP | $FN | $STABLE_ICON |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $adapter | - | - | - | - | - | ⏭️ |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Class V Eligibility Criteria" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Criterion | Requirement |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Confidence Drift | < 5% over 50 cycles |" >> $GITHUB_STEP_SUMMARY
          echo "| Memory Growth | < 0.1 MB/cycle |" >> $GITHUB_STEP_SUMMARY
          echo "| False Negatives | = 0 (zero tolerance) |" >> $GITHUB_STEP_SUMMARY
          echo "| Stability Rating | STABLE |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Workflow: adapter-stability.yml*" >> $GITHUB_STEP_SUMMARY

      - name: Upload combined summary
        uses: actions/upload-artifact@v4
        with:
          name: adapter-stability-summary-${{ github.run_number }}
          path: results/adapter-stability/**
          retention-days: 90

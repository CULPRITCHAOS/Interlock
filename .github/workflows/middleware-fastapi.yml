name: Interlock FastAPI Middleware Verification

on:
  push:
    branches: [ "main" ]
    paths:
      - 'python/**'
      - 'apps/examples/fastapi-demo/**'
  workflow_dispatch:

jobs:
  verify-fastapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js (The Brain)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Python (The Client)
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          npm install
          npm install -g tsx kill-port
          pip install -r python/requirements.txt

      - name: Start Interlock Brain (Node Core)
        run: |
          npx tsx apps/live-monitor/server.ts &
          echo "Brain started with PID $!"
          echo "BRAIN_PID=$!" >> $GITHUB_ENV
          sleep 5

      - name: Start FastAPI Client
        run: |
          python3 apps/examples/fastapi-demo/main.py &
          echo "Client started with PID $!"
          echo "CLIENT_PID=$!" >> $GITHUB_ENV
          sleep 5

      - name: Verify Health
        run: |
          curl -f http://localhost:3000/health  # Brain
          curl -f http://localhost:8000/work    # Client

      - name: Inject Failure into Brain (Chaos)
        run: |
          # We tell the Brain to simulate FAILURE. 
          # The Brain's Confidence will drop.
          # The Client will ask for decision -> Brain says REFUSE -> Client Refuses.
          curl -X POST http://localhost:3000/admin/inject-failure \
          -H "Content-Type: application/json" \
          -d '{"mode":"FORCE_ERROR"}'

      - name: Bombard Client (Trigger Remote Refusal)
        continue-on-error: true
        run: |
          # Increase duration and volume to ensure Confidence drops significantly (Reliability metric needs data)
          for i in {1..70}; do
            # 1. Hit the Client to check for Refusal (The Test)
            curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8000/work >> responses.log
            
            # 2. Hammer the Brain to TRIGGER the failure metrics
            # We send multiple requests to ensure the failure RATE spikes above the threshold (>10/min) quickly.
            for j in {1..3}; do
              curl -s -X POST http://localhost:3000/search \
                -H "Content-Type: application/json" \
                -d '{"vector":[0.1]}' > /dev/null &
            done
              
            sleep 0.1
          done

      - name: Verify Refusal (503s)
        run: |
          # grep returns exit code 1 if count is 0, which crashes the script.
          # force success so we can check the value manually.
          SC503=$(grep -c "503" responses.log || echo "0")
          echo "Refusals: $SC503"
          if [ "$SC503" -lt 5 ]; then
             echo "Failure: Expected at least 5 refusals (Circuit Breaker didn't trip), got $SC503"
             exit 1
          fi

      - name: Verify Incident Log Creation
        run: |
          if [ ! -f docs/LIVE_INCIDENTS.md ]; then
             echo "Failure: Log file not created"
             exit 1
          fi
          cat docs/LIVE_INCIDENTS.md
          grep "Traffic Refusal" docs/LIVE_INCIDENTS.md || exit 1

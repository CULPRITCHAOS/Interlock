name: Test and Certify

# Run on every push and pull request to validate Interlock claims
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Cancel stale runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test TypeScript/Node.js frontend and services
  test-frontend:
    name: Test Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run validation tests
        run: npm run validate
        continue-on-error: false

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results-node-${{ matrix.node-version }}
          path: |
            results/validation/**/*.md
            results/validation/**/*.json
          retention-days: 30

      - name: Check for test failures
        if: failure()
        run: |
          echo "::error::Validation tests failed on Node ${{ matrix.node-version }}"
          exit 1

  # Generate and verify certification badge
  certify:
    name: Generate Certification
    runs-on: ubuntu-latest
    needs: [test-frontend]
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate certification badge
        run: npx tsx scripts/generate-badge.ts
        env:
          INTERLOCK_SIGNING_KEY: ${{ secrets.INTERLOCK_SIGNING_KEY || 'test-key-for-ci' }}

      - name: Verify badge signature integrity
        run: |
          echo "Verifying badge signature integrity..."
          if [ -f results/badge/interlock_shield.json ]; then
            node -e "
              const fs = require('fs');
              const badge = JSON.parse(fs.readFileSync('results/badge/interlock_shield.json', 'utf8'));
              if (!badge.signature) {
                console.error('ERROR: Badge is missing signature!');
                process.exit(1);
              }
              if (!badge.valid_until) {
                console.error('ERROR: Badge is missing expiry date!');
                process.exit(1);
              }
              console.log('✓ Badge signature present');
              console.log('✓ Badge expiry set to:', badge.valid_until);
              console.log('✓ Interlock Class:', badge.interlockClass);
              console.log('✓ Load Rating:', badge.loadRating);
            "
          else
            echo "ERROR: Badge file not found"
            exit 1
          fi

      - name: Upload certification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: certification-badge
          path: |
            results/badge/interlock_shield.json
            results/badge/interlock_shield.md
            results/badge/*.svg
          retention-days: 90

      - name: Generate workflow summary
        if: always()
        run: |
          echo "# 🛡️ Interlock Certification Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f results/badge/interlock_shield.json ]; then
            node -e "
              const fs = require('fs');
              const badge = JSON.parse(fs.readFileSync('results/badge/interlock_shield.json', 'utf8'));

              console.log('## Badge Details');
              console.log('');
              console.log('| Property | Value |');
              console.log('|----------|-------|');
              console.log('| **Interlock Class** | ' + badge.interlockClass + ' |');
              console.log('| **Load Rating** | ' + badge.loadRating + ' |');
              console.log('| **Valid Until** | ' + badge.valid_until + ' |');
              console.log('| **Repository** | ' + badge.repository + ' |');
              console.log('| **Commit** | \`' + (badge.repo_commit ? badge.repo_commit.substring(0, 8) : 'null') + '\` |');
              console.log('');

              if (badge.reflexStatus === 'Active') {
                console.log('✅ **Reflex Active** - Flash crowd protection enabled');
              }
              if (badge.qualityFloorEnforced) {
                console.log('✅ **Quality Floor** - Refuses degraded queries');
              }
              if (badge.driftTolerancePercent) {
                console.log('✅ **Drift Tolerance** - ' + badge.driftTolerancePercent + '% validated');
              }
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Badge generation failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Certification generated at $(date -u +"%Y-%m-%d %H:%M:%S UTC")*" >> $GITHUB_STEP_SUMMARY

  # Final status check
  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [test-frontend, certify]
    if: always()

    permissions: {}

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test-frontend.result }}" != "success" ]; then
            echo "::error::Frontend tests failed"
            exit 1
          fi
          if [ "${{ needs.certify.result }}" != "success" ]; then
            echo "::error::Certification failed"
            exit 1
          fi
          echo "✅ All tests passed!"
